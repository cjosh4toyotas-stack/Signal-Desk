name = "signal-desk-alpaca-proxy"
main = "alpaca-proxy-worker.js"
compatibility_date = "2026-07-27"

# Secrets (APCA_API_KEY_ID, APCA_API_SECRET_KEY) are NOT set here.
# Set them with:
#   wrangler secret put APCA_API_KEY_ID
#   wrangler secret put APCA_API_SECRET_KEY
# They're encrypted and never appear in this file or in source control.

# AlpacaStreamRelay (Durable Object) backs the /stream WebSocket route.
# It holds the one WebSocket connection to Alpaca that most plans allow
# per account, and fans it out to every connected browser tab. Runs on
# Cloudflare's free plan — SQLite-backed Durable Objects don't require
# Workers Paid.
[[durable_objects.bindings]]
name = "ALPACA_STREAM"
class_name = "AlpacaStreamRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AlpacaStreamRelay"]

# KV namespace "signal-desk-memory" — alert dedupe + scan status. This id
# is the real namespace already created in this Cloudflare account; if you
# ever recreate it, run `wrangler kv namespace create signal-desk-memory`
# and paste the new id here.
[[kv_namespaces]]
binding = "SIGNAL_KV"
id = "9bdcf08b527b426ca13242f0d2e7cc10"

# Cron for the 13D alert scan (see `scheduled` in alpaca-proxy-worker.js):
# every 30 minutes. Push notifications additionally need:
#   wrangler secret put NTFY_TOPIC
# (a hard-to-guess ntfy.sh topic you subscribe to in the ntfy app; without
# it the scan still runs and /alerts-status still reports, no push is sent)
[triggers]
crons = ["*/30 * * * *"]
